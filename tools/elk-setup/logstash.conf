input {
  beats {
    port => 5044
  }
  syslog {
    port => 5000
    type => "syslog"
  }
}

filter {
  if [type] == "syslog" or [fields][log_type] == "auth" {
    grok {
      match => {
        "message" => "%{SYSLOGTIMESTAMP:timestamp} %{HOSTNAME:hostname} %{PROG:program}(?:\[%{POSINT:pid}\])?: %{GREEDYDATA:log_message}"
      }
    }

    # Detect SSH brute force attempts
    if [program] == "sshd" {
      grok {
        match => {
          "log_message" => [
            "Failed password for %{USERNAME:username} from %{IP:src_ip} port %{NUMBER:src_port}",
            "Invalid user %{USERNAME:username} from %{IP:src_ip} port %{NUMBER:src_port}",
            "Accepted password for %{USERNAME:username} from %{IP:src_ip} port %{NUMBER:src_port}",
            "Accepted publickey for %{USERNAME:username} from %{IP:src_ip} port %{NUMBER:src_port}"
          ]
        }
        tag_on_failure => []
      }

      geoip {
        source => "src_ip"
        target => "geoip"
      }
    }
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    user => "elastic"
    password => "changeme"
    index => "soc-lab-%{+YYYY.MM.dd}"
  }
  stdout {
    codec => rubydebug
  }
}
